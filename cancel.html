<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago cancelado | King Javi</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .result-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .result-card { max-width: 560px; }
        .result-icon { font-size: 4rem; margin-bottom: 1rem; }
        .result-card h1 { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; margin-bottom: 1rem; }
        .result-card p { color: var(--silver); font-size: 1.1rem; line-height: 1.6; margin-bottom: 1rem; }
        .result-actions { margin-top: 2rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>
    <main class="result-wrap">
        <div class="result-card">
            <div class="result-icon">🛒</div>
            <h1>Pago cancelado</h1>
            <p>No se ha realizado ningún cargo. Puedes volver a intentarlo cuando quieras o escribirme si tienes alguna duda antes de reservar.</p>
            <p>Recuerda: la <strong>primera clase es gratis</strong>. 🎁</p>
            <div class="result-actions">
                <a href="index.html#pricing" class="btn btn-gold">Ver precios de nuevo</a>
                <a href="index.html#contact" class="btn btn-outline">Hablar con Javi</a>
            </div>
        </div>
    </main>
</body>
</html>
