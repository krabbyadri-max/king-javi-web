<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago confirmado | King Javi</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .result-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
        .result-card { max-width: 560px; }
        .result-icon { font-size: 4rem; margin-bottom: 1rem; }
        .result-card h1 { font-family: 'Montserrat', sans-serif; font-size: 2.2rem; margin-bottom: 1rem; }
        .result-card h1 .gold { color: var(--gold); }
        .result-card p { color: var(--silver); font-size: 1.1rem; line-height: 1.6; margin-bottom: 1rem; }
        .result-actions { margin-top: 2rem; }
    </style>
</head>
<body>
    <main class="result-wrap">
        <div class="result-card">
            <div class="result-icon">👑✅</div>
            <h1>¡Pago <span class="gold">confirmado</span>!</h1>
            <p>Gracias por reservar tu clase con King Javi. Tu pago se ha procesado correctamente.</p>
            <p><strong>Javi te contactará en menos de 24h</strong> a tu email para acordar el horario y empezar. Si tienes prisa, escríbele por el formulario de contacto.</p>
            <div class="result-actions">
                <a href="index.html" class="btn btn-gold">Volver al inicio</a>
            </div>
        </div>
    </main>
</body>
</html>
